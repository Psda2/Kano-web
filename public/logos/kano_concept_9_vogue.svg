<svg width="400" height="200" viewBox="0 0 400 200" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="200" fill="#ffffff"/>
  <!-- Main Text: Thick, Bold, Tight Tracking -->
  <text x="50%" y="100" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="80" text-anchor="middle" fill="#000000" letter-spacing="-2">KANO</text>
  <!-- Subtext: Small, spaced out, serif -->
  <text x="50%" y="140" font-family="Times New Roman, serif" font-weight="400" font-size="14" text-anchor="middle" fill="#000000" letter-spacing="8">TRAVEL & TOURS</text>
  <!-- Accent: Tiny red dot -->
  <circle cx="200" cy="160" r="3" fill="#ff3333"/>
</svg>
