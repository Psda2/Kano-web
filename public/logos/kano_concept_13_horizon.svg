<svg width="400" height="150" viewBox="0 0 400 150" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="150" fill="#ffffff"/>
  
  <!-- Text Part -->
  <text x="50" y="90" font-family="Arial, sans-serif" font-weight="bold" font-size="60" fill="#333">KANO</text>
  
  <!-- Graphic Part: 3 Lines representing earth, sea, sky -->
  <line x1="250" y1="60" x2="350" y2="60" stroke="#87ceeb" stroke-width="8" stroke-linecap="round"/>
  <line x1="250" y1="80" x2="350" y2="80" stroke="#4682b4" stroke-width="8" stroke-linecap="round"/>
  <line x1="250" y1="100" x2="350" y2="100" stroke="#000080" stroke-width="8" stroke-linecap="round"/>
</svg>
