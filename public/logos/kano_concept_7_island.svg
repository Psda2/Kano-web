<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Circular container for a stamp/badge look -->
  <circle cx="100" cy="100" r="90" fill="none" stroke="#333" stroke-width="2"/>

  <!-- Sun -->
  <circle cx="130" cy="70" r="20" fill="#f4a261" opacity="0.9"/>

  <!-- Sea (Waves) -->
  <path d="M20 130 Q 50 110, 80 130 T 140 130 T 180 130" stroke="#2a9d8f" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M30 150 Q 60 130, 90 150 T 150 150 T 170 150" stroke="#264653" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- Coconut Tree (Minimalist) -->
  <!-- Trunk -->
  <path d="M70 130 Q 75 100, 65 60" stroke="#a47148" stroke-width="5" fill="none" stroke-linecap="round"/>
  <!-- Fronds -->
  <path d="M65 60 Q 40 50, 30 70" stroke="#2a9d8f" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M65 60 Q 50 30, 30 40" stroke="#2a9d8f" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M65 60 Q 90 30, 110 40" stroke="#2a9d8f" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M65 60 Q 100 60, 100 80" stroke="#2a9d8f" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- Brand Name -->
  <text x="100" y="180" font-family="Arial, sans-serif" font-weight="bold" font-size="14" letter-spacing="3" text-anchor="middle" fill="#333">KANO</text>
</svg>
